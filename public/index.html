<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>MySQL Charset Migrator</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='26'%3E%F0%9F%94%A4%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#view">ข้ามไปยังเนื้อหา</a>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">CS</span>
        <div class="brand-text">
          <strong>Charset Migrator</strong>
          <span class="brand-sub">local console</span>
        </div>
      </div>

      <div class="target-plate">
        <span class="plate-k">เป้าหมาย</span>
        <span class="plate-v" id="target-label">utf8mb3 / utf8mb3_general_ci</span>
      </div>

      <nav id="nav" aria-label="ขั้นตอนการทำงาน">
        <button class="nav-item" data-route="connect"><i aria-hidden="true">◉</i> เชื่อมต่อ</button>
        <button class="nav-item" data-route="overview" data-needs-session><i aria-hidden="true">▤</i> ภาพรวม</button>
        <button class="nav-item nav-main" data-route="tables" data-needs-session><i aria-hidden="true">▦</i> ตารางที่ต้องแปลง</button>
        <button class="nav-item" data-route="jobs" data-needs-session><i aria-hidden="true">◔</i> งานที่รันไปแล้ว</button>
        <button class="nav-item" data-route="inventory" data-needs-session><i aria-hidden="true">⌕</i> ค้นหาคอลัมน์</button>
        <button class="nav-item" data-route="logs" data-needs-session><i aria-hidden="true">≡</i> บันทึก</button>
      </nav>

      <div class="conn-card" id="conn-card">
        <div class="conn-off">ยังไม่เชื่อมต่อ</div>
      </div>

      <div class="sidebar-foot">
        <div class="pill pill-safe">loopback only</div>
        <div class="pill pill-safe">no outbound</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title">เชื่อมต่อฐานข้อมูล</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
